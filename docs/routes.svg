<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 436" role="img" aria-label="claude-lite adds a gateway hop; plain claude and its Remote Control servers stay direct" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #8c959f; }
    .arrowhead { fill: #8c959f; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .main { fill: #0969da; fill-opacity: 0.10; stroke: #0969da; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .arrowhead { fill: #6e7681; }
      .box { stroke: #6e7681; }
      .main { fill: #4493f8; fill-opacity: 0.14; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="904" height="436" rx="8"/>
  <text class="ink" x="24" y="34" font-size="15" font-weight="600">claude-lite adds a gateway hop; plain claude stays direct</text>

  <!-- connectors -->
  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M204 176H700" marker-end="url(#arrow)"/>
    <path d="M204 306H260" marker-end="url(#arrow)"/>
    <path d="M430 306H480" marker-end="url(#arrow)"/>
    <path d="M650 282H675V192H700" marker-end="url(#arrow)"/>
    <path d="M650 330H700" marker-end="url(#arrow)"/>
  </g>
  <text class="quiet" x="452" y="166" text-anchor="middle" font-size="11.5">direct, login token - Remote Control works</text>
  <text class="quiet" x="668" y="236" text-anchor="end" font-size="11.5">anthropic/ - login token forwarded</text>

  <!-- claude -->
  <rect class="box" x="24" y="140" width="180" height="72" rx="8"/>
  <text class="ink" x="114" y="164" text-anchor="middle" font-weight="600">claude</text>
  <text class="quiet" x="114" y="182" text-anchor="middle" font-size="11.5">settings.json only</text>
  <text class="quiet" x="114" y="198" text-anchor="middle" font-size="11.5">+ claude-rc@ servers</text>

  <!-- claude-lite -->
  <rect class="main" x="24" y="270" width="180" height="72" rx="8"/>
  <text class="ink" x="114" y="294" text-anchor="middle" font-weight="600">claude-lite</text>
  <text class="quiet" x="114" y="312" text-anchor="middle" font-size="11.5">+ litellm-settings.json</text>
  <text class="quiet" x="114" y="328" text-anchor="middle" font-size="11.5">no Remote Control</text>

  <!-- headers note -->
  <text class="quiet" x="24" y="376" font-size="11.5" font-weight="600">sends two headers:</text>
  <text class="quiet" x="24" y="394" font-size="11.5">Authorization: login token</text>
  <text class="quiet" x="24" y="410" font-size="11.5">x-litellm-api-key: gateway key</text>

  <!-- headers shim -->
  <rect class="box" x="260" y="258" width="170" height="96" rx="8"/>
  <text class="ink" x="345" y="282" text-anchor="middle" font-weight="600">headers shim :4001</text>
  <text class="quiet" x="345" y="300" text-anchor="middle" font-size="11.5">passes headers through</text>
  <text class="quiet" x="345" y="316" text-anchor="middle" font-size="11.5">PDF -&gt; page images</text>
  <text class="quiet" x="345" y="332" text-anchor="middle" font-size="11.5">strips \0 tool regex</text>

  <!-- LiteLLM -->
  <rect class="box" x="480" y="258" width="170" height="96" rx="8"/>
  <text class="ink" x="565" y="282" text-anchor="middle" font-weight="600">LiteLLM (patched)</text>
  <text class="quiet" x="565" y="300" text-anchor="middle" font-size="11.5">checks x-litellm-api-key</text>
  <text class="quiet" x="565" y="316" text-anchor="middle" font-size="11.5">routes by model name</text>
  <text class="quiet" x="565" y="332" text-anchor="middle" font-size="11.5">Postgres: spend log</text>

  <!-- Anthropic -->
  <rect class="box" x="700" y="148" width="180" height="56" rx="8"/>
  <text class="ink" x="790" y="172" text-anchor="middle" font-weight="600">Anthropic API</text>
  <text class="quiet" x="790" y="190" text-anchor="middle" font-size="11.5">Opus, Sonnet, Haiku</text>

  <!-- Claude app -->
  <rect class="box" x="700" y="52" width="180" height="44" rx="8"/>
  <text class="ink" x="790" y="79" text-anchor="middle" font-weight="600">Claude app, claude.ai</text>
  <path class="edge" fill="none" stroke-width="1.25" d="M790 96V148" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="quiet" x="782" y="126" text-anchor="end" font-size="11.5">Remote Control</text>

  <!-- OpenCode Go -->
  <rect class="box" x="700" y="272" width="180" height="130" rx="8"/>
  <text class="ink" x="790" y="296" text-anchor="middle" font-weight="600">OpenCode Go</text>
  <text class="quiet" x="790" y="314" text-anchor="middle" font-size="11.5">own key, flat usage cap</text>
  <text class="quiet" x="790" y="336" text-anchor="middle" font-size="11.5">custom_openai/:</text>
  <text class="quiet" x="790" y="352" text-anchor="middle" font-size="11.5">DeepSeek V4.1, GLM 5.3</text>
  <text class="quiet" x="790" y="370" text-anchor="middle" font-size="11.5">openai/responses/:</text>
  <text class="quiet" x="790" y="386" text-anchor="middle" font-size="11.5">GPT-6 Luna, Muse Spark</text>
</svg>
